<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Converter tests</title>
    <style>
      body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 24px; }
      .ok { color: #0a7d32; }
      .fail { color: #c2362b; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1 id="summary">Running…</h1>
    <ul id="list"></ul>
    <script src="harness.js"></script>
    <script src="../converter.js"></script>
    <script src="../app-state.js"></script>
    <script src="converter.test.js"></script>
    <script src="app-state.test.js"></script>
    <script>
      const { results } = window.TestHarness;
      const failed = results.filter((r) => !r.ok);
      document.getElementById("summary").textContent =
        `${results.length - failed.length}/${results.length} passed`;
      document.getElementById("summary").className = failed.length ? "fail" : "ok";
      for (const r of results) {
        const li = document.createElement("li");
        li.className = r.ok ? "ok" : "fail";
        li.textContent = r.ok ? `✓ ${r.name}` : `✗ ${r.name} — ${r.error}`;
        document.getElementById("list").append(li);
      }
    </script>
  </body>
</html>
